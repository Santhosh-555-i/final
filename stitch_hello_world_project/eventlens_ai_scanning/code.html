<style>
        .scan-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, transparent, rgba(192, 193, 255, 0.8), transparent);
            box-shadow: 0 0 20px 5px rgba(192, 193, 255, 0.4);
            animation: scan 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes scan {
            0% { transform: translateY(-10%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110%); opacity: 0; }
        }

        .mesh-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(192, 193, 255, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(192, 193, 255, 0.05) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        .pulse-ring {
            animation: pulse-ring 3s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { transform: scale(2.5); opacity: 0; }
        }

        .text-fade-in-out {
            animation: fadeText 6s infinite;
        }

        @keyframes fadeText {
            0%, 25% { opacity: 1; content: "Extracting face vectors..."; }
            33%, 58% { opacity: 1; content: "Searching 1,420 event photos..."; }
            66%, 91% { opacity: 1; content: "Matching found!"; }
            100% { opacity: 0; }
        }
        
        .glow-effect {
            box-shadow: 0 0 40px rgba(192, 193, 255, 0.2);
        }
    </style>

<body class="bg-background text-on-background h-screen w-full overflow-hidden flex flex-col relative selection:bg-primary-container selection:text-on-primary-container">

<!-- Animated Mesh Background Overlay -->

<!-- Concentric Pulse Rings -->
<div class="absolute inset-0 rounded-full border border-primary/50 pulse-ring pointer-events-none"></div>
<div class="absolute inset-0 rounded-full border border-primary/30 pulse-ring pointer-events-none" style="animation-delay: 1s;"></div>

<div class="absolute bottom-0 w-full h-1 bg-primary shadow-[0_0_15px_rgba(192,193,255,0.8)]"></div>

<style>
                @keyframes progress {

                    100% { width: 100%; left: 0%; }
                }
            </style>
</div>
</main>
<!-- Bottom Nav / Shell omitted intentionally for this focused scanning state -->
<script>
        // Simple script to cycle through the status texts smoothly
        const statuses = [
            "Extracting face vectors...",
            "Searching 1,420 event photos...",
            "Matching found!"
        ];
        const statusElement = document.getElementById('status-text');
        let currentIndex = 0;

        setInterval(() => {
            // Fade out
            statusElement.style.opacity = '0';
            
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % statuses.length;
                statusElement.innerText = statuses[currentIndex];
                
                // If it's the final state, maybe change color or stop
                if (currentIndex === 2) {
                    statusElement.classList.add('text-secondary-fixed-dim');
                    // In a real app, this would trigger a redirect or UI state change
                } else {
                    statusElement.classList.remove('text-secondary-fixed-dim');
                }
                
                // Fade in
                statusElement.style.opacity = '1';
            }, 500); // Wait for fade out transition (matching Tailwind duration-500)
            
        }, 3000); // Change text every 3 seconds
    </script>
